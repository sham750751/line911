name: Build Android APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify APK
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Khanza-Test-APK
          path: dist/
          retention-days: 14
