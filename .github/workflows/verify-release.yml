name: Verify signed Android installer
on:
  push:
    branches: [sar-expo-74]
    paths: ['dist/Sar-Expo-74.apk']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Verify distributable and get the original 0.1.0 installer
        run: |
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$bt/apksigner" verify --verbose --print-certs dist/Sar-Expo-74.apk
          (cd dist && sha256sum -c SHA256SUMS.txt)
          git fetch --depth 1 origin 9c23976ae5930dbf78c9b1c2e2f00c7ee1a1c1d6
          git show FETCH_HEAD:dist/Sar-Expo-74.apk >/tmp/legacy.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 tests/device.py
