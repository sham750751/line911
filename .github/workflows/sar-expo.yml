name: Sar Expo 74 Android
on:
  push:
    branches: [sar-expo-74]
    paths-ignore: ['dist/**', '.github/workflows/verify-release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: node tests/ledger.cjs
      - run: bash build.sh
      - name: Bundle matching Android SDK signature tool
        run: |
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          cp "$bt/lib/apksigner.jar" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: Sar-Expo-74-Signing-Input
          path: |
            dist/Sar-Expo-74-unsigned.apk
            dist/apksigner.jar
          retention-days: 60
  interface-test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --break-system-packages playwright
      - run: python3 tests/mobile.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sar-Expo-74-Preview
          path: /tmp/sar-home.png
