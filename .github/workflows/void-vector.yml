name: Build VOID VECTOR game
on:
  push:
    paths:
      - 'void-vector/**'
      - '.github/workflows/void-vector.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify game APK
        run: bash void-vector/build-game.sh
      - name: Upload game installer
        uses: actions/upload-artifact@v4
        with:
          name: Void-Vector-APK
          path: void-vector/dist/
          retention-days: 30
      - name: Install browser test driver
        run: python3 -m pip install --break-system-packages playwright
      - name: Mobile gameplay regression checks
        run: python3 void-vector/tests/smoke.py
      - name: Upload test screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Void-Vector-QA
          path: void-vector/test-output/
          retention-days: 14
